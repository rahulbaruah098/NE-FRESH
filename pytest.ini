[pytest]
addopts = -ra
markers =
    static: source/template/route/form contract tests that need only Python + pytest
    pure: executable business-rule tests extracted from current source without Flask/Mongo dependencies
    runtime: Flask + Mongo-compatible runtime tests; requires requirements.txt + requirements-dev.txt
    finance: protected payment/payout/refund/reconciliation invariant tests
    smoke: representative route rendering/role-boundary smoke tests
