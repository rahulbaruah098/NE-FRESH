{% extends "base.html" %}
{% block content %}
<style>
  main.container{
    padding-bottom: 0 !important;
    margin-bottom: 0 !important;
  }

  /* ============================================
     ✅ FORGOT PASSWORD — BRUTALIST CRIMSON (MATCH LOGIN)
     - Same full-bleed system + grain overlay + cursor
     - Same outlined big heading + hover shadow
     - Same brutal form card + inputs + button
     - Keeps HTML structure/fields exactly
     ============================================ */

  .forgot-page{
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    position: relative;
    overflow-x: clip;
 font-weight: bold;
    background: #FAF9F6;
    color: #000;
    padding: clamp(28px, 4vw, 70px) 0;
    font-family: 'Cormorant Garamond', serif;
  }

  /* Grain overlay */
  .forgot-page::after{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.08;
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="4" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
    animation: grain 0.5s steps(6) infinite;
  }

  @keyframes grain{
    0%,100%{transform:translate(0,0);}
    10%{transform:translate(-5%,-10%);}
    20%{transform:translate(-15%,5%);}
    30%{transform:translate(7%,-25%);}
    40%{transform:translate(-5%,25%);}
    50%{transform:translate(-15%,10%);}
    60%{transform:translate(15%,0%);}
    70%{transform:translate(0%,15%);}
    80%{transform:translate(3%,35%);}
    90%{transform:translate(-10%,10%);}
  }

  /* Cursor (desktop only) */
  @media (min-width: 481px){
    .forgot-page,
    .forgot-page *{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 4c-2 0-3 1-4 2l-2 3c-1 1-2 2-2 4v6c0 2 1 3 2 4l2 3c1 1 2 2 4 2s3-1 4-2l2-3c1-1 2-2 2-4v-6c0-2-1-3-2-4l-2-3c-1-1-2-2-4-2zm0 2c1 0 2 1 3 2l2 2c1 1 1 2 1 3v6c0 1 0 2-1 3l-2 2c-1 1-2 2-3 2s-2-1-3-2l-2-2c-1-1-1-2-1-3v-6c0-1 0-2 1-3l2-2c1-1 2-2 3-2z" fill="%238B0000"/><circle cx="16" cy="12" r="1.5" fill="%238B0000"/><circle cx="16" cy="20" r="1.5" fill="%238B0000"/></svg>'), auto;
    }
    .forgot-page button,
    .forgot-page a{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 4c-2 0-3 1-4 2l-2 3c-1 1-2 2-2 4v6c0 2 1 3 2 4l2 3c1 1 2 2 4 2s3-1 4-2l2-3c1-1 2-2 2-4v-6c0-2-1-3-2-4l-2-3c-1-1-2-2-4-2zm0 2c1 0 2 1 3 2l2 2c1 1 1 2 1 3v6c0 1 0 2-1 3l-2 2c-1 1-2 2-3 2s-2-1-3-2l-2-2c-1-1-1-2-1-3v-6c0-1 0-2 1-3l2-2c1-1 2-2 3-2z" fill="%238B0000"/><circle cx="16" cy="12" r="1.5" fill="%238B0000"/><circle cx="16" cy="20" r="1.5" fill="%238B0000"/><path d="M16 14l4 4h-8z" fill="%238B0000"/></svg>'), pointer !important;
    }
  }
  @media (max-width: 480px){
    .forgot-page,
    .forgot-page *{ cursor:auto !important; }
  }

  .forgot-container{
    max-width: none;
    margin: 0;
    padding: 0 clamp(14px, 3vw, 44px);
    position: relative;
    z-index: 1;
  }

  .forgot-header{
    text-align:center;
    margin: 0 auto clamp(18px, 4vw, 34px);
    position: relative;
    z-index: 1;
  }

  /* ✅ Heading style exactly like login */
  .forgot-header h2{
    margin: 0;
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 7vw, 86px);
    font-weight: 900;
    line-height: .95;
    text-transform: uppercase;
    letter-spacing: clamp(-2px, -0.2vw, -4px);
    border: 4px solid #000;
    padding: clamp(10px, 2vw, 18px) clamp(16px, 4vw, 46px);
    background: #FAF9F6;
    transition: all .28s ease;
  }
  .forgot-header h2 span{ color:#8B0000; }

  .forgot-header h2:hover{
    transform: translate(3px,3px);
    box-shadow: -10px -10px 0 #8B0000;
    background: #fff;
  }

  .forgot-header p{
    margin: 16px auto 0;
    max-width: 820px;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 600;
    color: #333;
    line-height: 1.6;
    padding: 0 6px;
  }

  /* soften <b> */
  .forgot-header p b{
    font-weight: 700;
    color:#0b0b0b;
  }

  /* Form card — same as login */
  .form{
    margin: 0 auto;
    max-width: 720px;
    border: 4px solid #000;
    background: #FAF9F6;
    border-radius: 0;
    padding: clamp(18px, 3vw, 40px);
    box-shadow: none;
    position: relative;
    overflow: hidden;
    transition: all .28s ease;
  }

  .form label{
    display:block;
    margin-bottom: 10px;
    font-family: 'Italiana', serif;
    font-size: 14px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #000;
  }

  .form input[type="text"]{
    width:100%;
    padding: 16px 20px;
    border: 4px solid #000;
    border-radius: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    background: #FAF9F6;
    color: #000;
    outline:none;
    transition: all .28s ease;
    min-height: 56px;
    margin-top: 10px;
    -webkit-appearance:none;
    appearance:none;
  }

  .form input[type="text"]::placeholder{
    color:#666;
    font-weight:400;
  }

  .form input[type="text"]:focus{
    background:#fff;
    border-color:#8B0000;
    box-shadow: 10px 10px 0 #8B0000;
  }

  .form input[type="text"]:hover{
    background:#fff;
    box-shadow: 10px 10px 0 rgba(0,0,0,.18);
    transform: translate(-1px,-1px);
  }

  /* Button — same as login */
  .btn{
    width: 100%;
    min-height: 58px;
    border: 4px solid #000;
    border-radius: 0;
    background: #8B0000;
    color: #FAF9F6;
    font-family:'Playfair Display', serif;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    padding: 18px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    transition: all .3s ease;
    box-shadow: none;
    margin-top: 12px;
    white-space: nowrap;
    cursor: pointer;
  }

  .btn:hover{
    background:#000;
    transform: translate(4px,4px);
    box-shadow: -8px -8px 0 #8B0000;
    filter:none;
  }
  .btn:active{ transform: translate(0,0); box-shadow:none; }

  @media (max-width: 768px){
    .form{ max-width: 100%; }
  }
  @media (max-width: 480px){
    .forgot-page{ padding: 22px 0; }
    .btn{ font-size: 18px; }
  }

  /* Touch devices: keep calmer */
  @media (hover: none) and (pointer: coarse){
    .forgot-header h2:hover,
    .form input[type="text"]:hover,
    .btn:hover{
      transform:none;
      box-shadow:none;
    }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .forgot-page::after{ animation:none !important; opacity:.05; }
    .forgot-header h2, .form, .form input, .btn{
      transition:none !important;
      animation:none !important;
    }
  }
</style>

<div class="forgot-page">
  <div class="forgot-container">

    <div class="forgot-header">
      <h2>Forgot <span>Password</span></h2>
      <p>Enter your registered <b>email or phone</b>. If an account exists, you’ll get a reset link.</p>
    </div>

    <form method="post" class="form">
      <label>Email or Phone
        <input type="text" name="identifier" placeholder="you@example.com or +911234567890" required>
      </label>
      <button class="btn">Send reset link</button>
    </form>

  </div>
</div>

{% endblock %}
