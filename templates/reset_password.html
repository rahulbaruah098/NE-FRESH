{% extends "base.html" %}
{% block content %}

<section class="cc-reset-page" data-page="reset-password">
  <style>
    /* =========================================
       RESET PASSWORD — MATCH STORE DASHBOARD THEME
       ✅ NO route/logic changes
       ✅ Same HTML structure (h2 + form.form)
       ✅ Fully responsive (web + mobile/app)
       Scoped to .cc-reset-page
       ========================================= */

    @import url('https://fonts.googleapis.com/css2?family=Italiana&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap');

    .cc-reset-page{
      --crimson:#8B0000;
      --black:#000;
      --off-white:#FAF9F6;
      --light-crimson:#FFF5F5;
      --border:4px;
      --t:.28s;

      width:100vw;
      margin-left:calc(50% - 50vw);
      margin-right:calc(50% - 50vw);
      background:var(--off-white);
      color:var(--black);
      font-family:'Cormorant Garamond', serif;
      line-height:1.6;
      min-height:75vh;
      position:relative;
       font-weight: bold;
      overflow-x:hidden;
      padding-bottom:2.75rem;
    }
    .cc-reset-page,
    .cc-reset-page *{ box-sizing:border-box; border-radius:0 !important; }

    /* Spoon cursor */
    .cc-reset-page,
    .cc-reset-page *{
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 2 C10 2 8 6 8 10 C8 12 9 14 10 14 C11 14 11 13 11 12 C11 10 12 8 14 8 L14 20 L12 20 C10 20 10 22 12 24 L14 26 L14 30 L18 30 L18 26 L20 24 C22 22 22 20 20 20 L18 20 L18 8 C20 8 21 10 21 12 C21 13 21 14 22 14 C23 14 24 12 24 10 C24 6 22 2 16 2 Z" fill="%238B0000" stroke="%23000000" stroke-width="1"/></svg>'), auto;
    }
    .cc-reset-page a,
    .cc-reset-page button,
    .cc-reset-page input{ cursor:pointer; }
    .cc-reset-page ::selection{ background:var(--crimson); color:#fff; }

    /* Grain */
    .cc-reset-page .grain{
      position: fixed;
      inset: 0;
      pointer-events:none;
      z-index: 1;
      opacity: .12;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
    }

    /* Top bar */
    .cc-reset-page .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 1rem 2rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      border-bottom: var(--border) solid var(--black);
      background: var(--off-white);
      font-family: 'Italiana', serif;
      font-size: .85rem;
      letter-spacing: .45em;
      text-transform: uppercase;
      font-variant: small-caps;
      overflow:hidden;
    }
    .cc-reset-page .top-bar span{ white-space:nowrap; }

    /* Hero */
    .cc-reset-page .hero{
      position: relative;
      z-index: 2;
      text-align:center;
      padding: 3.75rem 2rem 3rem;
      border-bottom: var(--border) solid var(--black);
      background: var(--off-white);
    }
    .cc-reset-page .hero-title{
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 4.2vw, 2.35rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 0 0 .35rem 0;
    }
    .cc-reset-page .hero-title b{
      color: var(--crimson);
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
      font-style: italic;
      margin-left: .2rem;
    }
    .cc-reset-page .hero-sub{
      margin: 0 auto 1.25rem;
      max-width: 760px;
      opacity: .9;
      font-weight: 600;
    }
    .cc-reset-page .hero-divider{
      width: 6rem;
      height: 4px;
      background: var(--crimson);
      margin: 0 auto;
    }

    .cc-reset-page .wrap{
      position: relative;
      z-index: 2;
      max-width: 980px;
      margin: 0 auto;
      padding: 1.75rem 2rem 0;
      display:grid;
      place-items:center;
    }

    /* Keep your h2 in markup, but hide it visually (hero replaces it) */
    .cc-reset-page h2{ display:none; }

    /* Form panel */
    .cc-reset-page .form{
      width: min(560px, 100%);
      border: var(--border) solid var(--black);
      background: var(--off-white);
      padding: 1.35rem 1.25rem;
    }
    .cc-reset-page .form::before{
      content:"SECURITY";
      display:block;
      font-family: 'Italiana', serif;
      font-size: .72rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--crimson);
      padding: 0 0 .75rem 0;
      border-bottom: 2px solid rgba(0,0,0,.25);
      margin-bottom: 1rem;
    }

    /* Labels & inputs */
    .cc-reset-page .form label{
      display:block;
      font-weight: 900;
      margin: 0 0 .85rem 0;
      font-family: 'Playfair Display', serif;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .95rem;
    }
    .cc-reset-page .form input{
      display:block;
      width:100%;
      margin-top: .5rem;
      padding: 12px 12px;
      border: 2px solid var(--black);
      background: #fff;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      min-height: 46px; /* app-friendly */
      transition: transform var(--t), background var(--t);
    }
    .cc-reset-page .form input:focus{
      background: var(--light-crimson);
      transform: translateY(-1px);
    }

    /* Button (uses your existing .btn class) */
    .cc-reset-page .btn{
      width:100%;
      margin-top: .25rem;
      padding: 12px 14px;
      border: var(--border) solid var(--black);
      background: var(--crimson);
      color:#fff;
      font-family: 'Italiana', serif;
      font-size: .78rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      font-weight: 900;
      box-shadow: 6px 6px 0 var(--black);
      transition: transform var(--t), background var(--t), box-shadow var(--t);
      min-height: 46px;
    }
    .cc-reset-page .btn:hover{
      transform: translateY(-2px);
      background: var(--black);
      box-shadow: 8px 8px 0 var(--crimson);
    }
    .cc-reset-page .btn:active{ transform: translateY(-1px) scale(.99); }

    /* Small helper note under form (optional, no markup needed) */
    .cc-reset-page .form::after{
      content:"Tip: Use at least 6 characters. Keep it unique and strong.";
      display:block;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px dashed rgba(0,0,0,.25);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      opacity: .85;
    }

    /* Responsive */
    @media (max-width: 980px){
      .cc-reset-page .top-bar{ padding: .95rem 1rem; font-size: .62rem; letter-spacing: .32em; }
      .cc-reset-page .hero{ padding: 3.1rem 1rem 2.5rem; }
      .cc-reset-page .wrap{ padding: 1.35rem 1rem 0; }
      .cc-reset-page .form{ padding: 1.15rem 1rem; }
    }
    @media (max-width: 420px){
      .cc-reset-page .form label{ font-size: .92rem; }
      .cc-reset-page .btn{ letter-spacing: .28em; }
      .cc-reset-page .hero-title{ font-size: 1.45rem; }
    }
    @media (prefers-reduced-motion: reduce){
      .cc-reset-page *{ transition:none !important; }
    }
  </style>

  <div class="grain" aria-hidden="true"></div>

  <div class="top-bar">
    <span>EST. 2018</span>
    <span>MIZORAM, INDIA</span>
  </div>

  <header class="hero">
    <div class="hero-title">Reset <b>Password</b></div>
    <p class="hero-sub">Create a new password for your account. Please type it twice to confirm.</p>
    <div class="hero-divider"></div>
  </header>

  <div class="wrap">
    <!-- ✅ YOUR ORIGINAL MARKUP (UNCHANGED) -->
    <h2>Reset Password</h2>
    <form method="post" class="form">
      <label>New Password
        <input type="password" name="password" required minlength="6">
      </label>
      <label>Confirm Password
        <input type="password" name="confirm" required minlength="6">
      </label>
      <button class="btn">Update Password</button>
    </form>
    <!-- ✅ END -->
  </div>
</section>

{% endblock %}
