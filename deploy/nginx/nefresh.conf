# Replace __NEFRESH_DOMAIN__ during installation (deploy/install_system.sh).
# This is the HTTP bootstrap configuration. After DNS points to the EC2 Elastic
# IP, run Certbot with --nginx; Certbot will add TLS and the HTTPS redirect.

upstream nefresh_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __NEFRESH_DOMAIN__;

    client_max_body_size 6m;

    # Static files are immutable source artifacts for one release, but the
    # application historically reuses filenames. Keep cache lifetime modest to
    # avoid stale CSS/JS after UI deployments.
    location /static/ {
        alias /srv/nefresh/current/static/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }

    # Runtime uploads continue through Flask so the existing path validation and
    # application behavior remain unchanged. S3 can replace this in a later phase.

    location / {
        proxy_pass http://nefresh_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
