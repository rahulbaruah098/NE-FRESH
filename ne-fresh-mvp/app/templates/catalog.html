
{% extends "base.html" %}
{% block content %}
<h1>Catalog</h1>
<div class="cards">
  {% for p in products %}
  <article class="card">
    <img src="{{ p.image_url or url_for('static', filename='img/placeholder.jpg') }}" alt="{{ p.name }}">
    <div class="pad">
      <h3><a href="/p/{{ p.slug }}">{{ p.name }}</a></h3>
      <p class="muted">{{ p.description }}</p>
      <p><del>₹{{ p.price_mrp }}</del> <strong>₹{{ p.price_sale }}</strong> / {{ p.unit }}</p>
      <div class="row">
        <a class="btn-outline" href="/p/{{ p.slug }}">Buy Now</a>
      </div>
    </div>
  </article>
  {% else %}
    <p>No products yet.</p>
  {% endfor %}
</div>
{% endblock %}
